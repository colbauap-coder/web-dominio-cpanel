name: Verificar secretos cPanel SSH

on:
  push:
    branches: [verify-cpanel-secrets]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar que los secretos existen
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Falta SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "Falta SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Falta SSH_USER"; exit 1; }
          test -n "$SSH_PORT" || { echo "Falta SSH_PORT"; exit 1; }
          echo "Los cuatro secretos requeridos existen."

      - name: Probar conexión SSH sin desplegar
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "pwd >/dev/null"
          echo "La conexión SSH funcionó."
